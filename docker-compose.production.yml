# docker-compose.production.yml production configuration, uses the base configuration in docker-compose.yml

services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    volumes:
      - ${IMAGES_VOLUME}:/${APP_IMAGES_DIR}
    ports:
      - ${SERVER_PORT}:3000
    depends_on:
      - postgres
